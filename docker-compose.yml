services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "${APP_PORT:-8000}:8000"
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - .:/var/www/html
      - lum_vendor:/var/www/html/vendor
      - lum_node_modules:/var/www/html/node_modules
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:${APP_PORT:-8000}"
      VITE_DEV_SERVER_URL: "http://localhost:${VITE_PORT:-5173}"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite

  web:
    profiles:
      - production
    build:
      context: .
      target: production
    ports:
      # Behind Caddy: WEB_BIND=127.0.0.1. Direct IP preview: WEB_BIND=0.0.0.0
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_SCHEME: ${APP_SCHEME:-http}
      APP_HOST: ${APP_HOST:-45.151.62.114}
      # Use ${VAR-default} (not :-) so empty APP_PORT stays empty for HTTPS domain mode.
      # :- would treat APP_PORT= as missing and inject WEB_PORT → broken :8080 absolute URLs.
      APP_PORT: ${APP_PORT-${WEB_PORT:-8080}}
      APP_URL: ${APP_URL:-http://45.151.62.114:8080}
      DB_CONNECTION: sqlite
      # Keep sqlite under storage so the named volume does not hide
      # database/migrations + database/seeders from the image.
      DB_DATABASE: /var/www/html/storage/database/database.sqlite
    volumes:
      - ./.env:/var/www/html/.env:ro
      - lum_storage:/var/www/html/storage
    networks:
      - lum

  caddy:
    profiles:
      - production
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-info@lumresidence.com}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - lum

volumes:
  lum_vendor:
  lum_node_modules:
  lum_storage:
  caddy_data:
  caddy_config:

networks:
  lum:
    driver: bridge
